<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Unit 2 Class Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
 --bg:#0d1620;--panel:#16222e;--panel2:#1d2c3a;--ink:#eef4f9;--muted:#93a8ba;--line:#28394a;
 --accent:#5aa9e6;--go:#46c07f;--warn:#e8a04a;--red:#ef6b4a;--pre:#eef4f9;--img:#5aa9e6;--scale:1}
:root[data-theme="light"]{--bg:#eef2f6;--panel:#fff;--panel2:#f5f8fb;--ink:#14202b;--muted:#5c6f80;
 --line:#dbe3ec;--accent:#2e5fa3;--go:#1f7a4d;--warn:#b5651d;--red:#c2451f;--pre:#14202b;--img:#2e5fa3}
*{box-sizing:inherit}html{font-size:calc(16px*var(--scale))}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Source Sans 3",system-ui,sans-serif;
 overflow:hidden;font-size:1rem}
.app{display:grid;grid-template-rows:auto 1fr auto;height:100%}
header{display:flex;align-items:center;gap:11px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:.95rem;margin:0;font-weight:800;white-space:nowrap}
header h1 em{font-style:normal;color:var(--accent)}
select,.mini{font:inherit;font-size:.82rem;font-weight:600;background:var(--panel2);color:var(--ink);
 border:1px solid var(--line);border-radius:8px;padding:5px 9px;cursor:pointer}
.mini:hover{border-color:var(--accent)}
.mini[aria-pressed=true]{background:var(--warn);border-color:var(--warn);color:#1a1005}
.spacer{flex:1}
.sizer{display:inline-flex;align-items:center;gap:5px;background:var(--panel2);border:1px solid var(--line);
 border-radius:9px;padding:3px 7px}
.sizer b{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}
.sizer button{padding:2px 8px;font-size:.95rem;line-height:1.2}
.sizer #sizeVal{font-size:.76rem;font-variant-numeric:tabular-nums;color:var(--muted);min-width:2.9em;text-align:center}
.tag{font-size:.68rem;font-weight:800;letter-spacing:.09em;padding:3px 9px;border-radius:99px;text-transform:uppercase}
.tag.lab{background:var(--warn);color:#1a1005}.tag.math{background:var(--accent);color:#06121c}
.tag.assess{background:var(--red);color:#1d0803}.tag.int{background:var(--go);color:#04130b}
.tool{display:inline-block;font-size:.42em;font-weight:800;letter-spacing:.09em;text-transform:uppercase;padding:4px 11px;border-radius:99px;vertical-align:middle;margin-left:14px;position:relative;top:-.28em}
.tool.gim{background:#7d4bd6;color:#fff}
.tool.dm{background:#1f8a5f;color:#fff}
.plan li i{font-style:normal;font-size:.72em;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:5px;margin-left:5px}
.plan li i.gim{background:#7d4bd6;color:#fff}
.plan li i.dm{background:#1f8a5f;color:#fff}
main{display:grid;grid-template-columns:1fr 310px;min-height:0}
@media(max-width:900px){main{grid-template-columns:1fr}}
.stage{padding:14px 24px 0;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.phaseName{font-size:clamp(1.4rem,calc(3.4vw*var(--scale)),2.5rem);font-weight:800;line-height:1.05;margin:0 0 3px;letter-spacing:-.02em}
.phaseSub{color:var(--muted);font-size:clamp(.88rem,calc(1.3vw*var(--scale)),1.08rem);margin:0 0 9px}
.need{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:8px;
 padding:5px 11px;font-size:clamp(.8rem,calc(1.15vw*var(--scale)),.98rem);margin-bottom:12px}
.need b{color:var(--warn);font-size:.74em;letter-spacing:.09em;text-transform:uppercase;margin-right:7px}
.body{overflow-y:auto;min-height:0;display:flex;gap:20px;align-items:flex-start;padding-bottom:12px}
.steps{list-style:none;padding:0;margin:0;counter-reset:s;flex:1;min-width:0}
.steps li{font-size:clamp(1.02rem,calc(1.95vw*var(--scale)),1.5rem);line-height:1.38;padding:9px 0 9px 42px;position:relative;
 border-bottom:1px solid var(--line)}
.steps li:before{content:counter(s);counter-increment:s;position:absolute;left:0;top:11px;width:28px;height:28px;
 border-radius:50%;background:var(--accent);color:#08121b;font-size:.72em;font-weight:800;display:grid;place-items:center}
.steps li u{text-decoration:none;font-weight:800;color:var(--warn)}
.steps li.bare{padding-left:0;border-bottom:0}
.steps li.bare:before{content:none;counter-increment:none;display:none}
.demo{flex:0 0 clamp(200px,calc(30vw*var(--scale)),420px)}
.demo svg{display:block;width:100%;height:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.dctl{margin-top:9px;display:flex;flex-direction:column;gap:7px}
.dctl .cr{display:flex;align-items:center;gap:8px;font-size:.84rem;font-weight:700}
.dctl .cr label{min-width:1.5em;color:var(--muted)}
.dctl .cr input[type=range]{flex:1;accent-color:var(--accent);height:22px}
.dctl .cr b{min-width:2.6em;text-align:right;font-variant-numeric:tabular-nums;color:var(--accent)}
.dctl .seg2{display:flex;gap:5px;flex-wrap:wrap}
.dctl .seg2 button{flex:1 1 auto;font:inherit;font-size:.76rem;font-weight:700;padding:5px 7px;cursor:pointer;
 border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:7px}
.dctl .seg2 button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#08121b}
.rulebox{margin-top:9px;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--go);
 border-radius:9px;padding:9px 12px;font-size:.98rem;font-weight:800;font-variant-numeric:tabular-nums;min-height:1.3em}
.rulebox span{display:block;font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
 color:var(--muted);margin-bottom:2px}
.dbtns{display:flex;gap:7px;margin-top:9px}
.dbtns button{flex:1;font:inherit;font-size:.83rem;font-weight:700;padding:7px 0;border-radius:8px;cursor:pointer;
 border:1px solid var(--go);background:transparent;color:var(--go)}
.dbtns button.play{border-color:var(--accent);color:var(--accent)}
.revBtn{font:inherit;font-size:.7rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
 padding:3px 11px;border-radius:7px;cursor:pointer;border:1px solid var(--go);background:transparent;
 color:var(--go);flex:0 0 auto}
.revBtn.on{background:var(--go);color:#07130d}
.plainline{display:block;margin-top:5px;font-size:.82em;font-style:italic;color:var(--go);opacity:.95}
.plainline b{font-style:normal;font-size:.86em;letter-spacing:.06em;opacity:.85}
.fill{display:inline-block;min-width:5.5em;border-bottom:2px solid var(--warn);text-align:center;
 font-weight:800;color:var(--warn)}
.fill.on{border-bottom-color:var(--go);color:var(--go)}
.demo .cap{font-size:.92rem;margin:0 0 7px;font-weight:600;line-height:1.35}
.demo .ans{margin-top:8px;font-size:.98rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--go);min-height:1.3em}
.demo button{font:inherit;font-size:.82rem;font-weight:700;padding:6px 13px;border-radius:8px;cursor:pointer;
 border:1px solid var(--go);background:transparent;color:var(--go);margin-top:7px}
.tn{border-top:2px solid var(--warn);background:color-mix(in srgb,var(--warn) 9%,transparent);
 padding:8px 24px 10px;font-size:clamp(.78rem,calc(1.05vw*var(--scale)),.95rem);color:var(--warn);line-height:1.42}
.tn b{font-size:.72em;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:3px;opacity:.85}
.tn div{margin:2px 0}
.tn.hide{display:none}
.rail{border-left:1px solid var(--line);background:var(--panel);padding:14px;display:flex;flex-direction:column;
 gap:11px;min-height:0;overflow-y:auto}
.clock{text-align:center;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:11px 8px}
.clock .t{font-size:clamp(2.2rem,calc(5.6vw*var(--scale)),3.5rem);font-weight:800;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.03em}
.clock .t.low{color:var(--red)}
.clock .lbl{color:var(--muted);font-size:.74rem;text-transform:uppercase;letter-spacing:.09em;margin-top:4px}
.row{display:flex;gap:6px}
.row button{flex:1;font:inherit;font-weight:700;font-size:.83rem;padding:8px 0;border-radius:9px;cursor:pointer;
 border:1px solid var(--line);background:var(--panel2);color:var(--ink)}
.row button.go{background:var(--go);border-color:var(--go);color:#07130d}
.bar{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);width:0%;transition:width .35s linear}
.rail h3{font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:2px 0 0;font-weight:700}
.plan{list-style:none;margin:0;padding:0;font-size:.83rem}
.plan li{display:flex;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:7px;cursor:pointer}
.plan li:hover{background:var(--panel2)}
.plan li.on{background:var(--accent);color:#08121b;font-weight:700}
.plan li b{font-variant-numeric:tabular-nums;opacity:.85}
a.lnk{display:block;text-decoration:none;color:var(--ink);background:var(--panel2);border:1px solid var(--line);
 border-left:3px solid var(--accent);border-radius:9px;padding:8px 10px;font-size:.83rem;font-weight:600}
a.lnk span{display:block;color:var(--muted);font-weight:400;font-size:.75rem;margin-top:1px}
footer{display:flex;align-items:center;gap:13px;padding:7px 16px;border-top:1px solid var(--line);
 background:var(--panel);font-size:.77rem;color:var(--muted)}
kbd{background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;
 padding:1px 6px;font-family:inherit;font-size:.82em;font-weight:700;color:var(--ink)}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>Unit&nbsp;2 <em>Console</em></h1>
  <select id="daySel"></select>
  <span class="tag" id="kindTag"></span>
  <div class="spacer"></div>
  <button class="mini" id="tnBtn" aria-pressed="true" title="Hide the orange strip at the bottom so only the students’ directions show">My notes on</button>
  <button class="mini" id="themeBtn" title="Switch between the dark screen and a light one">Light</button>
  <span class="sizer" title="Make everything on screen bigger or smaller. Turn it up for the TVs, down for your laptop.">
    <b>Text size</b>
    <button class="mini" id="sizeDn" title="Smaller text">&minus;</button>
    <span id="sizeVal">100%</span>
    <button class="mini" id="sizeUp" title="Bigger text">+</button>
  </span>
  <button class="mini" id="fsBtn" title="Fill the whole screen — press F, or Esc to come back">Full screen</button>
</header>
<main>
  <section class="stage">
    <h2 class="phaseName" id="pName">&mdash;</h2>
    <p class="phaseSub" id="pSub"></p>
    <div class="need" id="pNeed" style="display:none"></div>
    <div class="body">
      <ol class="steps" id="pSteps"></ol>
      <div class="demo" id="demo" style="display:none">
        <p class="cap" id="dCap"></p>
        <svg id="dSvg" viewBox="0 0 340 340"></svg>
        <div id="dCtl" class="dctl"></div>
        <div class="rulebox" id="dRule"></div>
        <div class="ans" id="dAns"></div>
        <div class="dbtns">
          <button id="dPlay" class="play">&#9654;&nbsp; Play</button>
          <button id="dBtn">Reveal</button>
        </div>
      </div>
    </div>
  </section>
  <aside class="rail">
    <div class="clock"><div class="t" id="clk">0:00</div><div class="lbl" id="clkLbl">paused</div></div>
    <div class="bar"><i id="bar"></i></div>
    <div class="row"><button class="go" id="run">Start</button><button id="reset">Reset</button></div>
    <div class="row"><button id="prev">&larr; Prev</button><button id="next">Next &rarr;</button></div>
    <h3>Today</h3><ul class="plan" id="plan"></ul>
    <h3>Links</h3><div id="links"></div>
  </aside>
</main>
<div class="tn" id="tn"></div>
<footer>
  <span><kbd>Space</kbd> start</span><span><kbd>&rarr;</kbd> next</span><span><kbd>&larr;</kbd> back</span>
  <span><kbd>R</kbd> reveal</span><span><kbd>N</kbd> hide my notes</span><span><kbd>F</kbd> full screen</span>
  <div class="spacer"></div><span id="dayTag"></span>
</footer>
</div>
<script>
(function(){
"use strict";
var $=function(i){return document.getElementById(i)};
var NS="http://www.w3.org/2000/svg";
function el(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);return e}

var L={
 exp:{h:"Transformations Explorer",s:"play with the rule",u:"explorer.html"},
 sep30:{h:"Sept 30 animated lesson",s:"teach from this \u2014 examples move",u:"lesson-sep30.html"},
 laser:{h:"Mirror Shot laser lab",s:"Oct 1 \u2014 grid matches your paper",u:"laser-lab.html"},
 sheet:{h:"Mirror Shot data sheet",s:"Recorders enter pod data",u:"https://docs.google.com/spreadsheets/d/1ltLziHEwaifhf62PJIpRpWI7zLGB9FubvzkdDEAYVz8/edit"},
 hub:{h:"Unit 2 hub",s:"student links",u:"index.html"}
};
function D(cap,pre,img,ans,opt){var o=opt||{};o.cap=cap;o.pre=pre;o.img=img;o.ans=ans;return o}

/* Every block: n = title, m = minutes, s = subtitle, need = on your desk,
   do = EXPLICIT student directions (big, numbered, on the TV),
   tn = teacher notes (small orange strip, hideable with N) */
var DAYS=[
/* ============================ TUE SEP 29 ============================ */
{d:"Tue Sep 29",k:"lab",t:"Pick & Place",
 targets:["3.1","I can describe a motion precisely enough that someone else can carry it out."],
 links:[L.hub],
 blocks:[
  {n:"WARM UP",m:10,s:"Gimkit · Unit 1 retrieval · 10 min",
   need:"Chromebook · join code on Screen 2",
   do:["Open your Chromebook and join the Gimkit with the code on Screen 2.",
       "Play until the timer on this screen hits zero.",
       "When it stops, close the lid all the way. Chromebooks stay shut for the rest of today."],
   tn:["Coordinate plane, distance, midpoint. Nothing from this unit — today is a discovery day.",
       "Start on the bell. Do not wait for stragglers."]},
  {n:"BUILD YOUR L",m:5,s:"Every pod builds the same thing",
   need:"4 snap cubes · plain grid · folder · Week 1 packet",
   do:["Take exactly 4 snap cubes from the bag.",
       "Snap them into the L shape shown on Screen 2.",
       "Find the one cube with the red sticker. That is your <u>anchor cube</u>.",
       "Put the anchor cube on the START outline, bottom left of your grid.",
       "Stand the folder up between you and your partner so neither of you can see the other’s grid."],
   tn:["Two pods will build a mirror-image L. Let them — it surfaces in Round 2 and is worth more than a correction now.",
       "Red cube marked in advance. Marking them live costs four minutes, four times over."]},
  {n:"ROUND 1",m:8,s:"Plain grid · no coordinates · Director talks, Operator builds",
   need:"Plain grid · packet page 1",
   do:["<b>Director:</b> move your L somewhere on the grid. Do not show your partner.",
       "Tell your partner how to move theirs so it ends up in the same place.",
       "<b>Operator:</b> do exactly what you are told. Nothing else.",
       "Drop the folder. Did the two grids match?",
       "In your packet, write down the instruction that caused the biggest problem."],
   tn:["They will say “up a bit” and “over there.” Let it fail. The failure is the lesson.",
       "Do NOT supply the word 'units' yet. They should feel the need for it first."]},
  {n:"ROUND 2",m:8,s:"Coordinate grid · now they have numbers",
   need:"Coordinate grid · packet page 1",
   do:["Swap roles. New Director.",
       "Same game, but now your grid has numbers on it.",
       "Move your L. Describe the move so your partner lands in the same place.",
       "Drop the folder. Did it match this time?",
       "Write down what the numbers let you say that you could not say in Round 1."],
   tn:["Most pods now succeed. Ask one that did: “What did you say this time that you could not say before?”",
       "The word you are fishing for is <b>units</b> — and a direction."]},
  {n:"ROUND 3",m:10,s:"Turning · the hard one",
   need:"Coordinate grid · packet page 1",
   do:["Swap roles again.",
       "This time your L must be <u>turned</u>, not just slid.",
       "Describe the turn so your partner can reproduce it exactly.",
       "Drop the folder. Almost nobody matches on the first try.",
       "Write down every piece of information a turn needs that a slide does not."],
   tn:["This is the block that earns the day. Three things are missing and they will find them in this order:",
       "how far (the angle) · which way (clockwise or not) · <b>around what point</b> — the last one is the one nobody says."]},
  {n:"ROUND 4",m:10,s:"One sentence for the whole motion",
   need:"Coordinate grid · packet page 1",
   do:["Last round. Director moves the L — a slide AND a turn.",
       "You get <u>one sentence</u>. Write it down before you say it out loud.",
       "Read it once. Your partner builds. No follow-up questions allowed.",
       "Drop the folder.",
       "In your packet: what did you have to put in that sentence that you did not need in Round 1?"],
   tn:["Collect two or three of the winning sentences. You will put them on the board tomorrow.",
       "A sentence that works will name a distance, a direction, an angle, a turn direction and a center."]},
  {n:"DEBRIEF",m:4,s:"What a complete instruction contains",
   do:["Pods report: what made an instruction work?",
       "We are building the class list on the board. Copy it into your packet.",
       "Tomorrow we turn this list into rules that work every time."],
   tn:["Keep the list in THEIR words today. Tomorrow you replace their words with the real terms.",
       "Do not hand them 'translation' or 'rotation' yet. They get those tomorrow, attached to something they already built."]},
  {n:"EXIT TICKET",m:6,s:"Half sheet · hand to me at the door",
   need:"Half sheet · pencil",
   do:["Write the one instruction from today that a partner could follow with no questions asked.",
       "Then write one that failed, and say what was missing from it.",
       "Name and period. Hand it to me at the door."],
   tn:["Sort these tonight into: names a distance and direction / names a turn completely / vague.",
       "That sort is your Red–Yellow–Green for Monday."]}
 ]},

/* ============================ WED SEP 30 ============================ */
{d:"Wed Sep 30",k:"math",t:"Translations & rotations — the rules",
 targets:["3.1  ·  3.4","I can write a translation and a rotation as a rule and use it."],
 links:[L.exp,L.sep30],
 blocks:[
  {n:"WARM UP",m:10,tool:"dm",s:"DeltaMath in class · points and quadrants · 10 min",
   need:"Chromebook",
   do:["Open DeltaMath: <b>U2 Warm Up · Points and Quadrants</b>. Ten items.",
       "Plot each point and name the quadrant.",
       "You already know this. It is here because everything today depends on it."],
   tn:["Prior knowledge only — nothing from this unit has been taught yet.",
       "Watch who is slow to plot. That is who will struggle at the board in twenty minutes."]},
  {n:"WHAT BROKE YESTERDAY",m:5,s:"Their sentences, on the board",
   need:"Week 1 packet, page 1",
   do:["These are your sentences from Round 4.",
       "Which one would work on any figure, on any grid, every time?",
       "That is what a <u>rule</u> is. Today we write two of them."],
   tn:["Use the actual sentences you collected. Borrowed examples do not land the same way."]},
  {n:"TRANSLATIONS",m:12,s:"A slide · packet page 2 · pencil",
   need:"Week 1 packet, page 2 · pencil",
   do:["Fill in the TRANSLATION box on page 2 as we build it.",
       "Every point moves the same <u>distance</u> in the same <u>direction</u>.",
       "The rule: <b>(x, y) → (x + h, y + k)</b>.",
       "The vector ⟨ h, k ⟩ says the same thing a different way."],
   demo:D("Set h and k, then press Play.",[[-5,1],[-2,4],[-1,0]],null,null,
     {kind:"trans",controls:true,h:6,k:-3,labels:["A","B","C"]}),
   tn:["Run it once with a negative k. Ask what ⟨ 6, −3 ⟩ means before you press Play.",
       "“Right 6, DOWN 3” — the sign is the whole point. Say it out loud."]},
  {n:"ROTATIONS",m:14,s:"A turn · three things, not one",
   need:"Week 1 packet, page 2 · pencil",
   do:["A rotation needs THREE things. You found them yesterday in Round 3.",
       "<b>Center</b> · <b>angle</b> · <b>direction</b>. Write all three on page 2.",
       "Counterclockwise is the positive direction.",
       "Now the three rules about the origin — fill the table on page 2."],
   demo:D("Pick an angle and a direction, then press Play.",[[-5,1],[-2,4],[-1,0]],null,null,
     {kind:"rot",controls:true,deg:90,labels:["A","B","C"]}),
   tn:["90° ccw (−y, x) · 180° (−x, −y) · 270° ccw (y, −x).",
       "Show 90° clockwise and 270° counterclockwise back to back. Same picture. Say it is the same turn."]},
  {n:"WORKING BACKWARDS",m:10,s:"Given both figures, find the move",
   do:["Now the other direction: you are given the figure AND the image.",
       "Work one vertex at a time. What single move takes P to P′?",
       "Then check it on Q and R. If either one fails, it was not the answer."],
   demo:D("What translation maps △PQR onto △P′Q′R′? Work one piece at a time.",
     [[2,-1],[5,0],[3,2]],[[-3,2],[0,3],[-2,5]],null,
     {labels:["P","Q","R"],rule:"(x, y) → (x − 5, y + 3)      ⟨−5, 3⟩",
      stages:[{arrows:[0],t:"Start with <b>P(2, −1)</b> and its image <b>P′(−3, 2)</b>."},
              {arrows:[0,1],t:"Check it on <b>Q</b>. Same move?"},
              {arrows:[0,1,2],t:"And <b>R</b>. All three agree, so the move is confirmed."}]}),
   tn:["This is the half of the standard last year's test never asked. Spend the full ten minutes.",
       "Insist on the check. A student who confirms on one vertex has guessed, not solved."]},
  {n:"PRACTICE",m:4,s:"Packet page 2 · the two at the bottom",
   need:"Week 1 packet, page 2",
   do:["Work part (a) and part (b) at the bottom of page 2.",
       "(b) starts from the ORIGINAL triangle, not from your answer to (a).",
       "Check with the Explorer when you finish."],

       "over y = −x → (−y, −x)"],

   demo:D("Switch the line, then press Play. Watch the flat moment.",[[2,1],[6,3],[4,6]],null,null,
     {kind:"refl",controls:true,axis:"yx",labels:["A","B","C"]}),

{d:"Fri Oct 2",k:"math",t:"Dilations",
 targets:["3.3  ·  3.4","I can dilate a figure by a scale factor and tell rigid from not rigid."],
 links:[L.exp],
 blocks:[
  {n:"WARM UP",m:10,tool:"gim",s:"Gimkit · Set B vocabulary · 10 min",
   need:"Chromebook · join code on Screen 2",
   do:["Join the Gimkit with the code on Screen 2. <b>Set B</b>.",
       "Translations, rotations and reflections — everything taught so far this unit."],

  {n:"WHAT IS DIFFERENT",m:6,s:"The first transformation that changes size",
   need:"Week 1 packet, page 5",
   do:["Every move so far kept the figure exactly the same size.",
       "Watch this one. What changed that never changed before?",
       "Today’s transformation is the one that breaks that rule."],
   tn:["Let them name it: it got bigger. Then ask what did NOT change — the shape, the angles.",
       "That distinction is the whole of standard 3.3."]},
  {n:"THE RULE",m:12,s:"Packet page 5 · pencil",
   need:"Week 1 packet, page 5 · pencil",
   do:["Fill the dilation box on page 5 as we build it.",
       "A dilation needs a <u>center</u> and a <u>scale factor k</u>.",
       "About the origin the rule is <b>(x, y) → (kx, ky)</b>. Multiply BOTH coordinates.",
       "k > 1 makes it bigger. 0 &lt; k &lt; 1 makes it smaller."],
   demo:D("Pick a scale factor, then press Play.",[[1,2],[3,1],[2,3]],null,null,
     {kind:"dil",controls:true,k:2,labels:["A","B","C"]}),
   tn:["Run k = 1/2 and k = 2 back to back.",
       "Draw the ray from the origin through a vertex and its image — it passes through both. That is the check they will use on the project."]},
  {n:"RIGID OR NOT",m:10,s:"Congruent vs similar",
   need:"Week 1 packet, page 6 · pencil",
   do:["Fill the table at the top of page 6.",
       "Translations, rotations and reflections keep every length the same. They are <u>rigid</u>, and the image is <u>congruent</u>.",
       "A dilation changes length. Not rigid. The image is <u>similar</u> but not congruent.",
       "Write the sentence that answers: is a dilation rigid? Why not?"],
   tn:["Congruent and similar are the two words the written test and the project both use. Get them said out loud today.",
       "Worth thirty seconds: k = 1 is the one dilation that IS rigid — nothing moves."]},
  {n:"PRACTICE",m:11,s:"Packet pages 5 and 6",
   need:"Week 1 packet, pages 5 and 6",
   do:["Work △JKL with k = 1/2 and △DEF with k = 1/4 on page 5.",
       "Then the four practice problems at the bottom of page 6.",
       "Check yourself in the Explorer as you go."],
   tn:["Problem 4 (perimeter under k = 3) is the one to walk. Perimeter scales by k; area scales by k squared.",
       "If time runs short, cut the △DEF problem, not the perimeter one."]},
  {n:"GO DEEPER",m:6,s:"Green group · the card in your packet",
   need:"Go Deeper card",
   do:["Finished and checked? Take the Go Deeper card out of your packet.",
       "Pick any one problem. Write your answer on the back of the card.",
       "These are not graded. They are the interesting ones."],
   tn:["Card lives in the Week 1 packet all unit. Anyone can take one; nobody has to."]},
  {n:"EXIT TICKET",m:6,s:"Half sheet · hand to me at the door",
   need:"Half sheet · pencil",
   do:["1. Dilate A(8, −4) about the origin with k = 1/4. Give A′.",
       "2. Is a dilation a rigid transformation? One sentence, and say why.",
       "Name and period. Hand it to me at the door."],
   tn:["Answers: A′(2, −1). No — a dilation changes every length, so the image is not congruent.",
       "Anyone scaling only one coordinate goes in the Monday pile for 3.3."]}
 ]},

var LO=-8,HI=8,V=340,revealed=false,showTN=true;
function dx(x){return (x-LO)/(HI-LO)*V}
function dy(y){return V-(y-LO)/(HI-LO)*V}
function regular(n,r,rot){var p=[];for(var i=0;i<n;i++){
    var a=(rot+i*360/n)*Math.PI/180; p.push([r*Math.cos(a),r*Math.sin(a)]);}return p}
var P={h:6,k:-3,deg:90,dir:1,axis:"x",c:0,kk:2};
function rotp(p,d){var a=d*Math.PI/180,c=Math.cos(a),si=Math.sin(a);
  return [p[0]*c-p[1]*si, p[0]*si+p[1]*c]}
/* a reflection is a flip: collapse onto the line, then open out the far side.
   t = 0 is the original, t = 1 is the image, t = 0.5 sits flat on the line.   */
function reflp(p,t){
  var ax=P.axis, c=P.c, th, q;
  if(ax==="x")      { return [p[0], c + (p[1]-c)*(1-2*t)]; }
  if(ax==="y")      { return [c + (p[0]-c)*(1-2*t), p[1]]; }
  th = (ax==="yx") ? 45 : -45;
  q = rotp(p,-th);                       // line becomes the x-axis
  q = [q[0], q[1]*(1-2*t)];
  return rotp(q,th);
}
function reflLabel(){
  return {x:"the x-axis", y:"the y-axis", yx:"the line y = x", ynx:"the line y = \u2212x"}[P.axis]
    || ("the line "+(P.axis==="v"?"x = ":"y = ")+P.c);
}
function easeC(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function endPts(dm){
  var b=dm.pre;
  if(dm.kind==="trans") return b.map(function(p){return [p[0]+P.h,p[1]+P.k]});
  if(dm.kind==="rot")   return b.map(function(p){return rotp(p,P.deg*P.dir)});
  if(dm.kind==="refl")  return b.map(function(p){return reflp(p,1).map(function(v){
                            return Math.round(v*1e9)/1e9})});
  if(dm.kind==="dil")   return b.map(function(p){return [p[0]*P.kk, p[1]*P.kk]});
  return dm.img;
}
function ruleOf(dm){
  if(dm.kind==="trans"){
    var a=P.h>=0?"x + "+P.h:"x \u2212 "+Math.abs(P.h);
    var b=P.k>=0?"y + "+P.k:"y \u2212 "+Math.abs(P.k);
    return ["The rule","(x, y) \u2192 ("+a+", "+b+")      \u27E8"+P.h+", "+P.k+"\u27E9"];
  }
  if(dm.kind==="dil"){
    var kt = (P.kk===0.25)?"\u00BC":(P.kk===0.5)?"\u00BD":String(P.kk);
    return ["The rule","k = "+kt+"      (x, y) \u2192 ("+kt+"x, "+kt+"y)"+
      (P.kk>1?"      enlargement":"      reduction")];
  }
  if(dm.kind==="refl"){
    var r={x:"(x, \u2212y)",y:"(\u2212x, y)",yx:"(y, x)",ynx:"(\u2212y, \u2212x)"}[P.axis];
    return ["The rule", r
      ? "over "+reflLabel()+"      (x, y) \u2192 "+r
      : "over "+reflLabel()+"      no simple rule \u2014 count the squares across"];
  }
  if(dm.kind==="rot"){
    var a=((P.deg*P.dir)%360+360)%360;
    var r={0:"(x, y)",90:"(\u2212y, x)",180:"(\u2212x, \u2212y)",270:"(y, \u2212x)"}[a];
    var said=P.deg+"\u00B0 "+(P.dir>0?"counterclockwise":"clockwise");
    return ["The rule", said+(P.dir<0&&a!==180&&a!==0?"  =  "+a+"\u00B0 CCW":"")+"      (x, y) \u2192 "+r];
  }
  return ["",""];
}

function drawDemo(dm,anim){
  dmLive=dm;
  var s=$("dSvg"); while(s.firstChild)s.removeChild(s.firstChild);
  if(dm.sym){ drawSym(s,dm); return; }
  var base=dm.pre, end=endPts(dm);
  var span=7; base.concat(end).forEach(function(p){
    span=Math.max(span,Math.abs(p[0]),Math.abs(p[1]))});
  span+=1.2;                                  // keep labels off the edge
  LO=-Math.ceil(span/2)*2; HI=-LO;
  for(var v=LO;v<=HI;v++){
    s.appendChild(el("line",{x1:dx(v),y1:dy(LO),x2:dx(v),y2:dy(HI),stroke:"var(--line)","stroke-width":.8}));
    s.appendChild(el("line",{x1:dx(LO),y1:dy(v),x2:dx(HI),y2:dy(v),stroke:"var(--line)","stroke-width":.8}));}
  s.appendChild(el("line",{x1:dx(LO),y1:dy(0),x2:dx(HI),y2:dy(0),stroke:"var(--muted)","stroke-width":1.5}));
  s.appendChild(el("line",{x1:dx(0),y1:dy(LO),x2:dx(0),y2:dy(HI),stroke:"var(--muted)","stroke-width":1.5}));
  var stp=(HI-LO)>22?4:2;
  for(var t=LO+stp;t<=HI-stp;t+=stp){ if(t===0)continue;
    var a=el("text",{x:dx(t),y:dy(0)+11,"text-anchor":"middle","font-size":8,fill:"var(--muted)"});
    a.textContent=String(t).replace("-","\u2212"); s.appendChild(a);}
  if(dm.kind==="refl"){
    var L1,L2;
    if(P.axis==="x"){L1=[LO,P.c];L2=[HI,P.c];}
    else if(P.axis==="y"){L1=[P.c,LO];L2=[P.c,HI];}
    else if(P.axis==="yx"){L1=[LO,LO];L2=[HI,HI];}
    else {L1=[LO,-LO];L2=[HI,-HI];}
    s.appendChild(el("line",{x1:dx(L1[0]),y1:dy(L1[1]),x2:dx(L2[0]),y2:dy(L2[1]),
      stroke:"var(--warn)","stroke-width":2.6,"stroke-dasharray":"7 5"}));
    var lt=el("text",{x:dx(L2[0])-6,y:dy(L2[1])-8,"text-anchor":"end","font-size":11,
      "font-weight":700,fill:"var(--warn)"});
    lt.textContent=reflLabel(); s.appendChild(lt);
  }
  if(dm.line==="yx") s.appendChild(el("line",{x1:dx(LO),y1:dy(LO),x2:dx(HI),y2:dy(HI),
    stroke:"var(--warn)","stroke-width":2,"stroke-dasharray":"6 4"}));
  if(dm.vline!==undefined) s.appendChild(el("line",{x1:dx(dm.vline),y1:dy(LO),x2:dx(dm.vline),y2:dy(HI),
    stroke:"var(--warn)","stroke-width":2,"stroke-dasharray":"6 4"}));
  if(dm.kind==="rot"){
    base.forEach(function(p){var r=Math.hypot(p[0],p[1]); if(r<.2)return;
      s.appendChild(el("circle",{cx:dx(0),cy:dy(0),r:dx(r)-dx(0),fill:"none",stroke:"var(--muted)",
        "stroke-width":.9,"stroke-dasharray":"3 5",opacity:.45}));});
    s.appendChild(el("circle",{cx:dx(0),cy:dy(0),r:5,fill:"none",stroke:"var(--warn)","stroke-width":2}));
  }
  if(dm.kind==="dil"){
    var far=end.concat(base);
    base.forEach(function(p,i){
      var q=end[i], t=Math.max(Math.abs(q[0]),Math.abs(q[1]),Math.abs(p[0]),Math.abs(p[1]))||1;
      var sc=(HI-0.5)/t;
      s.appendChild(el("line",{x1:dx(0),y1:dy(0),x2:dx(p[0]*sc),y2:dy(p[1]*sc),
        stroke:"var(--warn)","stroke-width":1.2,"stroke-dasharray":"3 5",opacity:.7}));});
    s.appendChild(el("circle",{cx:dx(0),cy:dy(0),r:5,fill:"none",stroke:"var(--warn)","stroke-width":2}));
  }
  if(dm.kind==="trans") base.forEach(function(p,i){
    s.appendChild(el("line",{x1:dx(p[0]),y1:dy(p[1]),x2:dx(end[i][0]),y2:dy(end[i][1]),
      stroke:"var(--warn)","stroke-width":1.6,"stroke-dasharray":"5 5",opacity:.7}));});
  var L=dm.labels||["A","B","C"];
  shape(s,base,"var(--pre)",null,L);
  var moving=el("g",{}); s.appendChild(moving);
  function frame(p){while(moving.firstChild)moving.removeChild(moving.firstChild);
    shape(moving,p,"var(--img)",null,null);}
  var rb=ruleOf(dm);
  $("dRule").innerHTML = rb[0] ? "<span>"+rb[0]+"</span>"+rb[1] : "";
  function settle(){
    shape(s,end,"var(--img)","6 4",L.map(function(x){return x+"\u2032"}));
    var box=$("dAns"); box.innerHTML="";
    end.forEach(function(p,i){var d=document.createElement("div");
      d.textContent=L[i]+"\u2032 ("+String(p[0]).replace("-","\u2212")+", "+String(p[1]).replace("-","\u2212")+")";
      box.appendChild(d);});
  }
  if(dm.stages){
    shape(s,end,"var(--img)","6 4",L.map(function(x){return x+"\u2032"}));
    var box=$("dAns"); box.innerHTML="";
    dm.stages.slice(0,stage).forEach(function(st,si){
      (st.arrows||[]).forEach(function(vi){
        s.appendChild(el("line",{x1:dx(base[vi][0]),y1:dy(base[vi][1]),
          x2:dx(end[vi][0]),y2:dy(end[vi][1]),stroke:"var(--go)","stroke-width":2.6,
          "stroke-linecap":"round"}));
        s.appendChild(el("circle",{cx:dx(base[vi][0]),cy:dy(base[vi][1]),r:5.5,fill:"var(--go)"}));
        s.appendChild(el("circle",{cx:dx(end[vi][0]),cy:dy(end[vi][1]),r:5.5,fill:"var(--go)"}));
      });
      var d=document.createElement("div");
      d.innerHTML=st.t; d.style.marginBottom="3px";
      if(si===stage-1) d.style.color="var(--go)"; else d.style.color="var(--muted)";
      box.appendChild(d);
    });
    $("dRule").innerHTML = stage>=dm.stages.length && dm.rule
      ? "<span>The rule</span>"+dm.rule : "";
    return;
  }
  cancelAnimationFrame(rafC);
  if(anim && dm.kind){
    $("dAns").innerHTML="";
    var t0=null,DUR=1500;
    (function go(ts){ if(!t0)t0=ts;
      var u=Math.min(1,(ts-t0)/DUR), e=easeC(u);
      frame(dm.kind==="trans"
        ? base.map(function(p){return [p[0]+P.h*e,p[1]+P.k*e]})
        : dm.kind==="refl"
        ? base.map(function(p){return reflp(p,e)})
        : dm.kind==="dil"
        ? base.map(function(p){var f=1+(P.kk-1)*e; return [p[0]*f,p[1]*f]})
        : base.map(function(p){return rotp(p,P.deg*P.dir*e)}));
      if(u<1) rafC=requestAnimationFrame(go); else { while(moving.firstChild)moving.removeChild(moving.firstChild); settle(); }
    })(performance.now());
  } else if(revealed) settle();
}
function buildCtl(dm){

                '<div class="cr"><label>k</label><input type="range" id="ck" min="-8" max="8" step="1" value="'+P.k+'"><b id="ckv"></b></div>';
    ["h","k"].forEach(function(id){
      var e=$("c"+id); $("c"+id+"v").textContent=(P[id]>=0?"+":"\u2212")+Math.abs(P[id]);
      e.addEventListener("input",function(){P[id]=+this.value;

        revealed=false; drawDemo(dm,false);});});

    Array.prototype.forEach.call($("ckk").children,function(b){
      b.addEventListener("click",function(){

    c.innerHTML='<div class="seg2" id="cax">'+opts.map(function(o){
      return '<button data-a="'+o[0]+'" aria-pressed="'+(P.axis===o[0])+'">'+o[1]+'</button>'}).join("")+'</div>';
    Array.prototype.forEach.call($("cax").children,function(b){
      b.addEventListener("click",function(){

        this.setAttribute("aria-pressed","true");

        revealed=false; drawDemo(dm,false);});});
  } else if(dm.kind==="rot"){
    c.innerHTML='<div class="seg2" id="cdeg">'+[90,180,270].map(function(a){
        return '<button data-a="'+a+'" aria-pressed="'+(P.deg===a)+'">'+a+'\u00B0</button>'}).join("")+'</div>'+
      '<div class="seg2" id="cdir">'+[[1,"counterclockwise"],[-1,"clockwise"]].map(function(o){
        return '<button data-d="'+o[0]+'" aria-pressed="'+(P.dir===o[0])+'">'+o[1]+'</button>'}).join("")+'</div>';
    [["cdeg","a",function(v){P.deg=+v}],["cdir","d",function(v){P.dir=+v}]].forEach(function(o){
      var box=$(o[0]);
      Array.prototype.forEach.call(box.children,function(b){
        b.addEventListener("click",function(){
          Array.prototype.forEach.call(box.children,function(x){x.setAttribute("aria-pressed","false")});
          this.setAttribute("aria-pressed","true"); o[2](this.getAttribute("data-"+o[1]));
          revealed=false; drawDemo(dm,false);});});});
  }
}
function drawSym(s,dm){
  var n=dm.sym, pts=regular(n,6,90); LO=-8;HI=8;
  for(var v=-8;v<=8;v++){
    s.appendChild(el("line",{x1:dx(v),y1:dy(-8),x2:dx(v),y2:dy(8),stroke:"var(--line)","stroke-width":.8}));
    s.appendChild(el("line",{x1:dx(-8),y1:dy(v),x2:dx(8),y2:dy(v),stroke:"var(--line)","stroke-width":.8}));}
  if(revealed) for(var i=0;i<n;i++){
    var a=(90+i*180/n)*Math.PI/180,R=7.4;
    s.appendChild(el("line",{x1:dx(-R*Math.cos(a)),y1:dy(-R*Math.sin(a)),
      x2:dx(R*Math.cos(a)),y2:dy(R*Math.sin(a)),stroke:"var(--warn)","stroke-width":1.6,"stroke-dasharray":"5 4"}));}
  var d=pts.map(function(p,i){return (i?"L":"M")+dx(p[0])+" "+dy(p[1])}).join(" ")+" Z";
  s.appendChild(el("path",{d:d,fill:"none",stroke:"var(--pre)","stroke-width":2.4,"stroke-linejoin":"round"}));
  pts.forEach(function(p){s.appendChild(el("circle",{cx:dx(p[0]),cy:dy(p[1]),r:3.2,fill:"var(--pre)"}))});
  s.appendChild(el("circle",{cx:dx(0),cy:dy(0),r:4,fill:"none",stroke:"var(--go)","stroke-width":2}));
  var box=$("dAns"); box.innerHTML="";
  if(revealed) dm.ans.split("\n").forEach(function(l){
    var p=document.createElement("div"); p.textContent=l; box.appendChild(p);});
  $("dRule").innerHTML="";
}
function shape(s,pts,col,dash,lab){
  var d=pts.map(function(p,i){return (i?"L":"M")+dx(p[0])+" "+dy(p[1])}).join(" ")+" Z";
  var pa=el("path",{d:d,fill:"none",stroke:col,"stroke-width":2.2,"stroke-linejoin":"round"});
  if(dash)pa.setAttribute("stroke-dasharray",dash);
  s.appendChild(pa);
  pts.forEach(function(p,i){
    s.appendChild(el("circle",{cx:dx(p[0]),cy:dy(p[1]),r:3.2,fill:col}));
    if(lab){var t=el("text",{x:dx(p[0])+6,y:dy(p[1])-5,"font-size":11,"font-weight":700,fill:col});
      t.textContent=lab[i]; s.appendChild(t);}});
}

  });
}
function arm(){left=cur().m*60;running=false;$("run").textContent="Start";clearInterval(tick);paint()}
function paint(){
  var m=Math.floor(Math.abs(left)/60),s=Math.abs(left)%60;
  var e=$("clk"); e.textContent=(left<0?"+":"")+m+":"+(s<10?"0":"")+s;
  e.className="t"+(left<=60?" low":"");
  $("clkLbl").textContent=running?"running":"paused";
  var tot=cur().m*60;
  $("bar").style.width=Math.max(0,Math.min(100,(1-left/tot)*100))+"%";
}
function start(){running=!running;$("run").textContent=running?"Pause":"Start";
  clearInterval(tick); if(running)tick=setInterval(function(){left--;paint()},1000); paint()}
function step(n){blk=Math.max(0,Math.min(DAYS[day].blocks.length-1,blk+n));arm();render()}
$("run").addEventListener("click",start);
$("reset").addEventListener("click",arm);
$("next").addEventListener("click",function(){step(1)});
$("prev").addEventListener("click",function(){step(-1)});
$("daySel").addEventListener("change",function(){day=+this.value;blk=0;arm();render();
  try{localStorage.setItem("u2day",day)}catch(e){}});
$("tnBtn").addEventListener("click",function(){
  showTN=!showTN; this.setAttribute("aria-pressed",String(showTN));
  this.textContent=showTN?"My notes on":"My notes off"; render();
  try{localStorage.setItem("u2tn",showTN?"1":"0")}catch(e){}});
$("themeBtn").addEventListener("click",function(){
  var on=document.documentElement.getAttribute("data-theme")==="light";
  document.documentElement.setAttribute("data-theme",on?"dark":"light");
  this.textContent=on?"Light":"Dark";
  if(cur().demo)drawDemo(cur().demo);
  try{localStorage.setItem("u2theme",on?"dark":"light")}catch(e){}});
var scale=1;
function setScale(v){scale=Math.max(.75,Math.min(1.8,v));
  document.documentElement.style.setProperty("--scale",scale);
  var sv=document.getElementById("sizeVal"); if(sv) sv.textContent=Math.round(scale*100)+"%";
  try{localStorage.setItem("u2scale",scale)}catch(e){}}
$("sizeUp").addEventListener("click",function(){setScale(scale+.1)});
$("sizeDn").addEventListener("click",function(){setScale(scale-.1)});
$("fsBtn").addEventListener("click",function(){
  if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen()});
document.addEventListener("keydown",function(e){
  if(e.target.tagName==="SELECT")return;
  if(e.code==="Space"){e.preventDefault();start()}
  if(e.key==="ArrowRight")step(1);
  if(e.key==="ArrowLeft")step(-1);
  if((e.key==="r"||e.key==="R")&&cur().demo)$("dBtn").click();
  if(e.key==="n"||e.key==="N")$("tnBtn").click();
  if(e.key==="f"||e.key==="F")$("fsBtn").click()});
try{
  if(localStorage.getItem("u2theme")==="light"){
    document.documentElement.setAttribute("data-theme","light");$("themeBtn").textContent="Dark"}
  var sc=parseFloat(localStorage.getItem("u2scale")); if(sc)setScale(sc);
  if(localStorage.getItem("u2tn")==="0"){showTN=false;
    $("tnBtn").setAttribute("aria-pressed","false");$("tnBtn").textContent="My notes off"}
  var dd=parseInt(localStorage.getItem("u2day"),10);
  if(!isNaN(dd)&&dd>=0&&dd<DAYS.length)day=dd;
}catch(e){}
build();arm();render();
})();
</script>
</body>
</html>
