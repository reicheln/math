<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit 2 Setup Checklist</title><style>:root{--paper:#f4f6f9;--panel:#fff;--ink:#15222d;--muted:#5e6f7e;--line:#dde5ed;--accent:#2e5fa3;--warn:#b5651d;--ok:#1f7a4d;--red:#c2451f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0f1821;--panel:#17232e;--ink:#e7eef4;--muted:#9bb0c0;--line:#26343f;--accent:#7fb0e8;--warn:#e0a35c;--ok:#5cc48a;--red:#ff7a52}}
:root[data-theme="dark"]{--paper:#0f1821;--panel:#17232e;--ink:#e7eef4;--muted:#9bb0c0;--line:#26343f;--accent:#7fb0e8;--warn:#e0a35c;--ok:#5cc48a;--red:#ff7a52}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.55}
.wrap{max-width:900px;margin:0 auto;padding:20px 16px 70px}h1{font-size:1.6rem;margin:0 0 3px}.sub{color:var(--muted);margin:0 0 16px;font-size:.93rem}
.bar{position:sticky;top:0;z-index:5;background:var(--paper);padding:10px 0 12px;border-bottom:1px solid var(--line);margin-bottom:16px}
.track{height:10px;background:var(--panel);border:1px solid var(--line);border-radius:99px;overflow:hidden}.track i{display:block;height:100%;background:var(--ok);width:0%;transition:width .3s}
.barrow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;gap:10px;flex-wrap:wrap}.barrow button{font:inherit;font-size:.8rem;padding:5px 11px;border-radius:8px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--muted)}
section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 18px;margin-bottom:15px}section h2{font-size:1.06rem;margin:0 0 3px}
.when{font-size:.76rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 9px;border-radius:99px;margin-left:9px;vertical-align:2px}
.w1{background:var(--red);color:#fff}.w2{background:var(--warn);color:#fff}.w3{background:var(--accent);color:#fff}.lead{color:var(--muted);font-size:.89rem;margin:0 0 11px}
label.item{display:flex;gap:11px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}label.item:first-of-type{border-top:0}
label.item input{margin:3px 0 0;width:19px;height:19px;accent-color:var(--ok);flex:0 0 auto}.tx b{display:block;font-weight:600}.tx span{display:block;color:var(--muted);font-size:.85rem}
label.done .tx{opacity:.5}label.done .tx b{text-decoration:line-through}code{background:var(--paper);border:1px solid var(--line);padding:1px 6px;border-radius:5px;font-size:.85em}
</style></head><body><div class="wrap"><h1>Unit 2 — Setup Checklist</h1><p class="sub">Algebra 2 Functions. Ticks are saved in this browser. <a href="index.html">Unit home</a></p>
<div class="bar"><div class="barrow"><b id="count"></b><button id="reset">Clear all ticks</button></div><div class="track"><i id="fill"></i></div></div><div id="list"></div></div>
<script>
const S=[{"h": "Put the website up", "w": "w1", "when": "before Sep 29", "lead": "Everything in the website folder goes into your GitHub Pages repo as-is, all in one folder. No build step.", "items": [["Upload all 20 HTML files and the 2 PDFs", "Lesson pages, six tools, index, console and checklist, plus the pacing guide and reference sheet. They link to each other by file name, so keep them together."], ["Open the hub on a student Chromebook and click every tile", "The one test that catches a broken relative path."], ["Open console.html on the classroom laptop and set the text size", "It remembers. A− / A+ in the top bar."]]}, {"h": "Google Classroom", "w": "w1", "when": "before Sep 29", "lead": "One link students memorize.", "items": [["Pin the hub link", "Title it <b>Unit 2 — everything you need</b>."], ["Pin the pacing guide and reference sheet PDFs", "Or link the copies on the site."]]}, {"h": "DeltaMath", "w": "w2", "when": "week before", "lead": "Names match the DeltaMath Assignments document in 1 Teacher Plan.", "items": [["Warm-ups for 12 days", "<code>U2 L1 Warm-up</code> … <code>U2 Act3 Warm-up</code>. Topic for each is in the document."], ["Six exit tickets", "<code>U2 L2</code>, <code>U2 L3</code>, <code>U2 Act2</code>, <code>U2 L4</code>, <code>U2 L6</code>, <code>U2 L8 Exit Ticket</code> — three problems each, listed with answers."]]}, {"h": "Snorkl", "w": "w2", "when": "week before", "lead": "Five exit tickets. Prompt, image and three criteria for each are in the Snorkl Exit Tickets document.", "items": [["U2 L1 Exit Ticket — Sep 29", "Image: A2_U2_L1_ExitTicket_Graph.png"], ["U2 Act1 Exit Ticket — Oct 1", "Image: A2_U2_Act1_ExitTicket_Graph.png"], ["U2 L5 Exit Ticket — Oct 8", "Image: A2_U2_L5_ExitTicket_Graph.png"], ["U2 L7 Exit Ticket — Oct 13", "Image: A2_U2_L7_ExitTicket_Graph.png"], ["U2 Act3 Exit Ticket — Oct 15", "Image: A2_U2_Act3_ExitTicket_Graph.png"]]}, {"h": "Gimkit — 3 kits", "w": "w2", "when": "week before", "lead": "Import each CSV as a new kit.", "items": [["Unit 1 recap kit — Sep 29", "Your existing 53-question Unit 1 set."], ["<code>A2_U2_Gimkit_SetA_Lessons1-3.csv</code> — Oct 6 (and Oct 5)", "26 questions."], ["<code>A2_U2_Gimkit_SetB_Lessons4-6.csv</code> — Oct 13 (and Oct 12)", "18 questions."], ["<code>A2_U2_Gimkit_SetC_FullUnit.csv</code> — Oct 16 and Oct 20", "26 questions."]]}, {"h": "Desmos (Amplify) classroom activities", "w": "w2", "when": "week before", "lead": "Start a class session for each so students join with a code.", "items": [["Graphing Stories part 2 — Sep 29 and part 1 — Oct 1", "XQ M201 collection."], ["Function Transformations — Oct 13", "XQ 3.3."], ["What's My Transformation? and Turtle Crossing — Oct 15", "Preview Turtle Crossing; skip any screen outside the unit (no horizontal stretch)."]]}, {"h": "Printing", "w": "w3", "when": "none", "lead": "Nothing in this unit is printed. Practice is on scratch paper; exit tickets are digital.", "items": [["Scratch paper at every pod", "That's it."]]}, {"h": "Still to do (yours)", "w": "w3", "when": "before Oct 16", "lead": "On hold by your choice.", "items": [["Write the CFA for Oct 16", "Decide the reporting standards first (Twitchell uses 2.1–2.3; Lindgard a single Standard 2)."], ["Write the test for Oct 21–22 and the review for Oct 20", ""], ["Tell the department if absolute value equations or key features go on a common assessment", "Neither colleague assesses them."]]}];
const L=document.getElementById("list");
S.forEach((s,si)=>{const e=document.createElement("section");e.innerHTML="<h2>"+s.h+'<span class="when '+s.w+'">'+s.when+"</span></h2><p class='lead'>"+s.lead+"</p>"+s.items.map((it,ii)=>'<label class="item"><input type="checkbox" data-k="'+si+"-"+ii+'"><span class="tx"><b>'+it[0]+"</b><span>"+it[1]+"</span></span></label>").join("");L.appendChild(e);});
const boxes=[...document.querySelectorAll("input[type=checkbox]")];
function save(){try{const o={};boxes.forEach(b=>{if(b.checked)o[b.dataset.k]=1});localStorage.setItem("u2a2check",JSON.stringify(o));}catch(e){}}
function paint(){let n=0;boxes.forEach(b=>{b.parentNode.className="item"+(b.checked?" done":"");if(b.checked)n++;});document.getElementById("count").textContent=n+" of "+boxes.length+" done";document.getElementById("fill").style.width=(100*n/boxes.length)+"%";}
boxes.forEach(b=>b.addEventListener("change",()=>{save();paint();}));
document.getElementById("reset").onclick=()=>{if(!confirm("Clear every tick?"))return;boxes.forEach(b=>b.checked=false);save();paint();};
try{const o=JSON.parse(localStorage.getItem("u2a2check")||"{}");boxes.forEach(b=>{if(o[b.dataset.k])b.checked=true;});}catch(e){}
paint();
</script></body></html>
