<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unit 2 Class Console</title>
<style>:root{--paper:#f4f6f9;--panel:#fff;--ink:#15222d;--muted:#5e6f7e;--line:#dde5ed;--accent:#2e5fa3;--warn:#b5651d;--ok:#1f7a4d;--red:#c2451f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0f1821;--panel:#17232e;--ink:#e7eef4;--muted:#9bb0c0;--line:#26343f;--accent:#7fb0e8;--warn:#e0a35c;--ok:#5cc48a;--red:#ff7a52}}
:root[data-theme="dark"]{--paper:#0f1821;--panel:#17232e;--ink:#e7eef4;--muted:#9bb0c0;--line:#26343f;--accent:#7fb0e8;--warn:#e0a35c;--ok:#5cc48a;--red:#ff7a52}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.55}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 18px;background:#2e5fa3;color:#fff}
header h1{font-size:1.2rem;margin:0 12px 0 0}
select,button{font:inherit;font-size:1rem;padding:7px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
header button{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.4)}
main{max-width:1300px;margin:0 auto;padding:18px}
.daytitle{font-size:calc(1.9rem*var(--z));font-weight:800;margin:0 0 4px}
.daydate{color:var(--muted);font-size:calc(1.05rem*var(--z))}
.blocks{display:flex;gap:10px;margin:16px 0;flex-wrap:wrap}
.blk{flex:1;min-width:150px;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer}
.blk b{display:block;font-size:calc(1rem*var(--z))}
.blk span{color:var(--muted);font-size:calc(.9rem*var(--z))}
.blk.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--panel))}
.blk.done{opacity:.55}
.now{display:grid;grid-template-columns:1fr auto;gap:20px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 26px;align-items:center}
@media (max-width:800px){.now{grid-template-columns:1fr}}
.now h2{margin:0 0 8px;font-size:calc(2.2rem*var(--z));color:var(--accent)}
.now p{font-size:calc(1.6rem*var(--z));margin:0 0 12px;line-height:1.35}
.clock{font-variant-numeric:tabular-nums;font-size:calc(5rem*var(--z));font-weight:800;text-align:center;line-height:1}
.clock.low{color:var(--red)}
.ctl{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.links a{display:inline-block;margin:6px 8px 0 0;padding:10px 16px;border-radius:10px;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;font-size:calc(1.1rem*var(--z))}
.keys{color:var(--muted);font-size:.85rem;margin-top:14px}
</style></head><body style="--z:1">
<header><h1>Unit 2 Class Console</h1>
<select id="day" aria-label="Day"></select>
<button id="prev">◀ Day</button><button id="next">Day ▶</button>
<span style="flex:1"></span>
<button id="zm">A−</button><button id="zp">A+</button><a href="index.html" style="color:#fff">Unit home</a></header>
<main>
<div class="daytitle" id="dt"></div><div class="daydate" id="dd"></div>
<div class="blocks" id="blocks"></div>
<div class="now"><div><h2 id="bn"></h2><p id="bt"></p><div class="links" id="bl"></div></div>
<div><div class="clock" id="clock">0:00</div>
<div class="ctl"><button id="go">▶ Start</button><button id="nb">Next block ▶</button><button id="rs">Reset</button></div></div></div>
<p class="keys">Keys: Space start/pause · → next block · ← previous block · [ ] change day</p>
</main>

const MONTHS={Sep:8,Oct:9};
let di=0, bi=0, left=0, timer=null, z=1;
try{z=+localStorage.getItem("u2a2zoom")||1}catch(e){}
function todayIndex(){const now=new Date();let best=0;DAYS.forEach((d,i)=>{const p=d.date.split(" ");const dt=new Date(2026,MONTHS[p[1]],+p[2]);if(dt<=now)best=i;});return best;}
const sel=document.getElementById("day");
DAYS.forEach((d,i)=>{const o=document.createElement("option");o.value=i;o.textContent=d.date+" — "+d.title;sel.appendChild(o);});
function fmt(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
function stop(){clearInterval(timer);timer=null;document.getElementById("go").textContent="▶ Start";}
function setBlock(i){stop();const d=DAYS[di];bi=Math.max(0,Math.min(d.blocks.length-1,i));left=d.blocks[bi].min*60;draw();}
function setDay(i){di=(i+DAYS.length)%DAYS.length;sel.value=di;setBlock(0);}
function draw(){
  document.body.style.setProperty("--z",z);
  const d=DAYS[di],b=d.blocks[bi];
  document.getElementById("dt").textContent=d.title;
  document.getElementById("dd").textContent=d.date+(d.id&&d.id!=="—"?" · "+d.id.replace("Act","Activity "):"");
  const B=document.getElementById("blocks");B.innerHTML="";
  d.blocks.forEach((x,k)=>{const e=document.createElement("div");e.className="blk"+(k===bi?" on":"")+(k<bi?" done":"");e.innerHTML="<b>"+x.name+"</b><span>"+x.min+" min</span>";e.onclick=()=>setBlock(k);B.appendChild(e);});
  document.getElementById("bn").textContent=b.name;
  document.getElementById("bt").textContent=b.text;
  document.getElementById("bl").innerHTML=b.links.map(l=>'<a href="'+l.href+'" target="_blank">'+l.label+'</a>').join("");
  const c=document.getElementById("clock");c.textContent=fmt(left);c.className="clock"+(left<=60&&b.min>0?" low":"");
}
function toggle(){if(timer){stop();return;}if(left<=0)return;document.getElementById("go").textContent="❚❚ Pause";
  timer=setInterval(()=>{left--;draw();if(left<=0){stop();try{const a=new (window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator();o.connect(a.destination);o.frequency.value=660;o.start();setTimeout(()=>o.stop(),400);}catch(e){}}},1000);}
document.getElementById("go").onclick=toggle;
document.getElementById("nb").onclick=()=>setBlock(bi+1);
document.getElementById("rs").onclick=()=>setBlock(bi);
document.getElementById("prev").onclick=()=>setDay(di-1);
document.getElementById("next").onclick=()=>setDay(di+1);
sel.onchange=()=>setDay(+sel.value);
function zoom(dz){z=Math.max(.7,Math.min(1.8,+(z+dz).toFixed(2)));try{localStorage.setItem("u2a2zoom",z)}catch(e){}draw();}
document.getElementById("zm").onclick=()=>zoom(-.1);document.getElementById("zp").onclick=()=>zoom(.1);
document.addEventListener("keydown",e=>{if(e.target.tagName==="SELECT")return;
  if(e.key===" "){e.preventDefault();toggle();} else if(e.key==="ArrowRight")setBlock(bi+1); else if(e.key==="ArrowLeft")setBlock(bi-1);
  else if(e.key==="]")setDay(di+1); else if(e.key==="[")setDay(di-1);});
